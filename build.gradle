// Top-level build file for Google Android Stub Apps
// These stubs block automatic installation/update of unwanted system apps
// by declaring the same package names with a different signature.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
